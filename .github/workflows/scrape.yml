name: Scrape IOM Jobs

on:
  # Run every 4 hours automatically
  schedule:
    - cron: "0 */4 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  scrape:
    runs-on: ubuntu-latest

    # Give Actions permission to commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          # Only commit if the file actually changed
          git diff --staged --quiet || git commit -m "Update jobs data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
