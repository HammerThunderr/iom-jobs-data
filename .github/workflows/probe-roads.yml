name: Probe roads (temporary)
on:
  push:
    branches: [probe-roads]
    paths: ['probe/probe.py', '.github/workflows/probe-roads.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "probe output" || true
          git push origin HEAD:probe-roads
