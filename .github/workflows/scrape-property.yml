# .github/workflows/scrape-property.yml
#
# Isle of Man property listings scraper for Manx One.
# Same pattern as the JobTrain / IOM_OPEN_DATA workflows:
#   scheduled run -> scraper -> JSON in docs/ -> GitHub Pages -> Flutter app.
#
# Output: docs/property/properties.json
# Served at: https://<user>.github.io/<repo>/property/properties.json

name: Scrape Property Listings

on:
  schedule:
    # 06:00 and 18:00 UTC daily. Twice a day is plenty — listings move slowly
    # and hammering a small agency's server is how you get blocked.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      skip_safety_check:
        description: "Skip the drop-detection guard (use after enabling/disabling an agent)"
        type: boolean
        default: false

# Never let two runs overlap and fight over the same commit.
concurrency:
  group: scrape-property
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the JSON back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # polite 2s delay per page across all agents

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Snapshot previous data
        run: |
          # Kept so the safety check can compare PER AGENT. Comparing totals
          # broke the moment an agent was deliberately disabled.
          if [ -f docs/property/properties.json ]; then
            cp docs/property/properties.json /tmp/previous.json
            echo "Snapshotted previous run"
          else
            echo "No previous run to compare against"
          fi

      - name: Run scraper
        env:
          OUTPUT_PATH: docs/property/properties.json
        run: |
          mkdir -p docs/property
          python scripts/property/run.py

      - name: Sanity check output
        env:
          SKIP_CHECK: ${{ inputs.skip_safety_check }}
        run: |
          python - <<'PY'
          import json, os, sys

          with open("docs/property/properties.json", encoding="utf-8") as fh:
              new = json.load(fh)

          listings = new.get("listings", [])
          sources = new.get("meta", {}).get("sources", [])
          count = len(listings)
          priced = sum(1 for l in listings if l.get("price"))

          print(f"Scraped {count} listings ({priced} with a price)")
          for s in sources:
              print(f"  {s.get('status','?'):7} {s.get('agent')}: {s.get('count')}")

          if count == 0:
              sys.exit("ABORT: zero listings — something is badly broken.")

          if os.environ.get("SKIP_CHECK") == "true":
              print("\nSafety check skipped by manual request.")
              sys.exit(0)

          # Load the previous run, if any.
          previous = []
          if os.path.exists("/tmp/previous.json"):
              try:
                  with open("/tmp/previous.json", encoding="utf-8") as fh:
                      previous = json.load(fh).get("listings", [])
              except (json.JSONDecodeError, OSError):
                  print("Previous file unreadable — skipping comparison.")

          # Compare each agent against ITSELF. An agent that was switched off
          # simply is not in `sources`, so its absence never trips the guard.
          problems = []
          for s in sources:
              agent = s.get("agent")
              if s.get("status") != "ok":
                  print(f"\nWARNING: {agent} failed — {s.get('error')}")
                  print("  Its previous listings were carried over and flagged stale.")
                  continue
              before = sum(1 for l in previous if l.get("agent") == agent)
              now = s.get("count", 0)
              if before >= 20 and now < before * 0.5:
                  problems.append(f"{agent}: {now} now vs {before} before")

          if problems:
              print("\nSuspicious drops detected:")
              for p in problems:
                  print(f"  {p}")
              sys.exit("ABORT: a parser has probably broken. Re-run with "
                       "skip_safety_check if this drop is expected.")

          if count and priced / count < 0.5:
              print("\nWARNING: over half the listings have no price.")
          PY

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/property/properties.json

          # No changes is a normal outcome, not a failure.
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COUNT=$(python -c "import json;print(len(json.load(open('docs/property/properties.json'))['listings']))")
          git commit -m "Update property listings ($COUNT) [skip ci]"

          # Other scrapers in this repo commit to the same branch, so the remote
          # can move between checkout and push. Rebase onto whatever landed and
          # retry rather than failing the whole run.
          BRANCH=${{ github.ref_name }}
          for ATTEMPT in 1 2 3 4 5; do
            if git push origin HEAD:"$BRANCH"; then
              echo "Pushed on attempt $ATTEMPT"
              exit 0
            fi
            echo "Push rejected — rebasing onto origin/$BRANCH (attempt $ATTEMPT)"
            git pull --rebase --autostash origin "$BRANCH" || true
            sleep 5
          done

          echo "Failed to push after 5 attempts"
          exit 1
