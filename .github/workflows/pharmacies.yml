name: Update pharmacies

# Runs the pharmacy scraper weekly, plus a manual "Run workflow" button.
# Opening hours rarely change, so weekly is plenty.

on:
  schedule:
    # 06:00 UTC every Monday (07:00 Island time in summer).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

# Allow the job to push the updated JSON back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape pharmacies
        run: python scripts/scrape_pharmacies.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/pharmacies.json)" ]; then
            git add docs/pharmacies.json
            git commit -m "chore: refresh pharmacies.json ($(date -u +%Y-%m-%d))"
            git push
            echo "pharmacies.json updated."
          else
            echo "No change to pharmacies.json."
          fi
