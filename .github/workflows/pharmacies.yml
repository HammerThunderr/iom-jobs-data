name: Update pharmacies

# Runs the pharmacy scraper weekly, plus a manual "Run workflow" button.
# Opening hours rarely change, so weekly is plenty.

on:
  schedule:
    # 06:00 UTC every Monday (07:00 Island time in summer).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

# Allow the job to push the updated JSON back to the repo.
permissions:
  contents: write

# If another run of THIS workflow is already going, let it finish first.
concurrency:
  group: update-pharmacies
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a rebase can work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape pharmacies
        run: python scripts/scrape_pharmacies.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain docs/pharmacies.json)" ]; then
            echo "No change to pharmacies.json — nothing to do."
            exit 0
          fi

          git add docs/pharmacies.json
          git commit -m "chore: refresh pharmacies.json ($(date -u +%Y-%m-%d))"

          # Another workflow may have pushed to main while we were running.
          # Rebase our single commit on top of the latest remote and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (remote moved). Syncing and retrying - attempt $attempt..."
            git pull --rebase --autostash origin main || true
            sleep 3
          done

          echo "::error::Failed to push pharmacies.json after 5 attempts."
          exit 1
