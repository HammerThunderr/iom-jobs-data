# ─────────────────────────────────────────────────────────────
# Events scraper — official sources (see scripts/scrape_events.py)
#
# Runs four times a day. Events don't change minute to minute, and the
# venues' sites shouldn't be hammered. Also runs whenever the scraper itself
# is changed, so a fix can be checked straight away.
#
# If every source fails, or the event count collapses, the scraper exits
# with an error and the previous events.json is left untouched.
# ─────────────────────────────────────────────────────────────

name: Scrape Events

on:
  schedule:
    - cron: '17 5,11,17,23 * * *'   # 05:17, 11:17, 17:17, 23:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_events.py'
      - '.github/workflows/events.yml'

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_events.py

      - name: Commit and push (with retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update events $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::Could not push events.json after 5 attempts"
          exit 1
