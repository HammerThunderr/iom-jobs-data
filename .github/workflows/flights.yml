# ─────────────────────────────────────────────────────────────
# Add this to .github/workflows/flights.yml
#
# Scrapes Isle of Man Airport departures & arrivals every 5 min.
# Saves to docs/flights.json on GitHub Pages.
# ─────────────────────────────────────────────────────────────

name: Scrape Flights

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

concurrency:
  group: flights
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_flights.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights.json
          git diff --staged --quiet || git commit -m "chore: update flights $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
