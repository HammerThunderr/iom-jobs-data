# ─────────────────────────────────────────────────────────────
# Flight scraper workflow
# Place at: .github/workflows/flights.yml in iom-jobs-data repo
# ─────────────────────────────────────────────────────────────

name: Scrape Flights

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

concurrency:
  group: flights
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade certifi requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_flights.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights.json
          git diff --staged --quiet || git commit -m "chore: update flights $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
