# ─────────────────────────────────────────────────────────────
# Gov Jobs scraper workflow
# Place at: .github/workflows/gov_jobs.yml in iom-jobs-data repo
#
# Scrapes JobTrain IOM gov jobs every 4 hours.
# Uses Playwright to handle the JS-rendered pages.
# ─────────────────────────────────────────────────────────────

name: Scrape Gov Jobs

on:
  schedule:
    - cron: '15 6 * * *'   # daily at 6:15am UTC (15 min after main jobs)
  workflow_dispatch:

concurrency:
  group: gov_jobs
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper
        run: python scripts/scrape_gov_jobs.py

      - name: Commit and push (with retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gov_jobs.json

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update gov jobs $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
